name = "desktop-toolkit-p2p"
main = "signaling-worker.js"
compatibility_date = "2024-11-01"

# Durable Objects keep both peers in the same room (required for reliable pairing).
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Free plan: must use new_sqlite_classes (not new_classes)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
