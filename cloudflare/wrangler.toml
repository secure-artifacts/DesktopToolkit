name = "desktop-toolkit-p2p"
main = "signaling-worker.js"
compatibility_date = "2024-11-01"

# Durable Objects keep both peers in the same room (required for reliable pairing).
# Without this, Cloudflare may put sender/receiver on different isolates → forever timeout.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_classes = ["Room"]
